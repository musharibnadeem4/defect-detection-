name: CI

# Job 1 runs the torch-free inference test-suite on Python 3.11.
# Job 2 builds the Docker image, starts the container and smoke-tests it over HTTP.
# The same image was also built and run locally by the author (see reports/docker_local_check.md).

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  inference-tests:
    name: Inference tests (Python 3.11, no torch)
    runs-on: ubuntu-latest
    env:
      CI_REQUIRE_ARTIFACTS: "1"      # missing model files / example images fail the run instead of skipping
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-inference.txt

      - name: Install inference dependencies only
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-inference.txt pytest==8.3.4 httpx==0.28.1

      - name: Confirm torch is not installed
        run: python -c "import importlib.util as u, sys; sys.exit(1 if u.find_spec('torch') else 0)"

      - name: Run tests (API, preprocessing; torch-only checks are skipped by design)
        run: python -m pytest tests/api tests/test_preprocess.py tests/test_export_parity.py -v -rs

  docker:
    name: Docker build and container smoke test
    runs-on: ubuntu-latest
    env:
      IMAGE: defect-detection-api
      BASE: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - name: Model unit and example images are present
        run: |
          test -f artifacts/model.onnx
          test -f artifacts/model_meta.json
          test -f examples/images/01_defect_correct_cast_def_0_7896.jpeg
          test -f examples/images/05_normal_correct_cast_ok_0_3479.jpeg

      - name: Build image
        run: docker build -t "$IMAGE" .

      - name: Print image size
        run: |
          size=$(docker image inspect "$IMAGE" --format '{{.Size}}')
          line=$(awk -v s="$size" 'BEGIN { printf "image size: %d bytes (%.1f MB)", s, s / 1e6 }')
          echo "$line"
          echo "### Docker image" >> "$GITHUB_STEP_SUMMARY"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
          docker image ls "$IMAGE"

      - name: Image checks (non-root user, Python 3.11, no torch)
        run: |
          uid=$(docker run --rm --entrypoint id "$IMAGE" -u)
          echo "container uid: $uid"
          test "$uid" != "0"
          docker run --rm --entrypoint python "$IMAGE" --version | tee py_version.txt
          grep -q "Python 3.11" py_version.txt
          docker run --rm --entrypoint python "$IMAGE" -c "import importlib.util as u, sys; sys.exit(1 if u.find_spec('torch') else 0)"

      - name: Start container and wait for /ready
        run: |
          docker run -d --name api -p 8000:8000 "$IMAGE"
          for i in $(seq 1 60); do
            if curl -fsS "$BASE/ready"; then echo; exit 0; fi
            sleep 1
          done
          echo "container did not become ready within 60 s"
          docker logs api
          exit 1

      - name: Docker HEALTHCHECK reports healthy
        run: |
          for i in $(seq 1 90); do
            status=$(docker inspect -f '{{.State.Health.Status}}' api)
            echo "health: $status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          docker logs api
          exit 1

      - name: curl /health and /model-info
        run: |
          curl -fsS "$BASE/health" | tee health.json
          echo
          curl -fsS "$BASE/model-info" -o model_info.json
          python3 -c "import json; m = json.load(open('model_info.json')); print('model_version:', m['model_version']); print('threshold:', m['threshold']['value']); assert m['classes'] == ['normal', 'defective']"

      - name: curl /predict on example images and assert the JSON schema
        run: |
          curl -fsS -X POST "$BASE/predict" -F "file=@examples/images/01_defect_correct_cast_def_0_7896.jpeg;type=image/jpeg" -o defect.json
          cat defect.json; echo
          python3 scripts/check_predict_response.py defect.json --expect defective --model-info model_info.json
          curl -fsS -X POST "$BASE/predict" -F "file=@examples/images/05_normal_correct_cast_ok_0_3479.jpeg;type=image/jpeg" -o normal.json
          cat normal.json; echo
          python3 scripts/check_predict_response.py normal.json --expect normal --model-info model_info.json

      - name: Error handling returns the documented status codes
        run: |
          code=$(curl -s -o err415.json -w '%{http_code}' -X POST "$BASE/predict" -F "file=@README.md;type=text/plain")
          echo "text/plain -> $code"; cat err415.json; echo
          test "$code" = "415"
          code=$(curl -s -o err400.json -w '%{http_code}' -X POST "$BASE/predict" -F "file=@README.md;type=image/jpeg")
          echo "not an image -> $code"; cat err400.json; echo
          test "$code" = "400"

      - name: Container logs (JSON, one object per line)
        if: always()
        run: docker logs api || true

      - name: Clean up
        if: always()
        run: docker rm -f api || true
