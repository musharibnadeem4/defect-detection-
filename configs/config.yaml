# Single source of truth. Nothing in code should hardcode class names, image size or paths.

project:
  seed: 42

# Class names = sub-folder names under paths.raw_dir. Order defines label index.
# The LAST entry is treated as the positive class (the one we want to catch).
classes: [normal, defective]

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  external_dir: data/external
  manifest: data/processed/manifest.csv
  figures_dir: reports/figures
  models_dir: models
  splits: data/processed/splits.csv
  artifacts_dir: artifacts
  runs_dir: runs
  reports_dir: reports

image:
  extensions: [.jpg, .jpeg, .png]
  # Model input size. Provisional: chosen in Step 2 after looking at the native
  # resolution reported by EDA. Do not rely on it in the data tooling.
  size: 224

# Perceptual-hash duplicate detection (used by inspect/prepare/EDA).
duplicates:
  hash_size: 8            # 8 -> 64-bit pHash
  max_hamming: 8          # pHash candidate pairs: Hamming distance <= this (recall stage)
  max_rmse: 3.0           # confirm candidates: RMSE of 64x64 grayscale thumbs (0-255) <= this

# --- Stand-in dataset only (Kaggle casting). Replace/remove for the real client data. ---
standin:
  source_dir: data/external/casting/casting_data
  class_map:              # source folder -> project class name
    ok_front: normal
    def_front: defective
  n_images: 700
  positive_ratio: 0.18    # fraction of defective images in the subsample

# ---------------------------------------------------------------- Step 2
splits:
  train: 0.70
  val: 0.15
  test: 0.15
  n_tries: 10             # seeded StratifiedGroupKFold passes scored for balance (~4 s each)
  cv_folds: 5             # CV over train+val only; the test set is never part of CV

augmentation:             # train only. No hue/saturation jitter, no random crops (edge defects).
  hflip: true
  vflip: true
  rotation_deg: 15
  brightness: 0.2
  contrast: 0.2

training:
  batch_size: 32
  num_threads: 4          # torch CPU threads (this machine: 4 cores)
  num_workers: 0          # 0 is fastest for this tiny in-memory dataset on Windows
  weight_decay: 1.0e-4
  stage1_epochs: 2        # head only, backbone frozen
  stage1_lr: 1.0e-3
  stage2_epochs: 8        # max; fine-tune everything with early stopping
  stage2_lr: 1.0e-4
  patience: 3             # early stopping on val PR-AUC (stage 2 epochs)
  pretrained: true
  deterministic: true

baseline:                 # logistic regression on downsampled pixels
  size: 64
  C: [0.001, 0.01, 0.1, 1.0]   # picked on validation PR-AUC

threshold:
  target_recall: 0.95     # recall on the positive class required on VALIDATION

evaluation:
  bootstrap_resamples: 1000
  latency_warmup: 10
  latency_runs: 100

# Run order. imbalance in {none, weighted_loss, sampler}.
experiments:
  imbalance_sweep:        # phase 1: same model/size, only the imbalance strategy changes
    model: resnet18
    size: 224
    strategies: [none, weighted_loss, sampler]
  architectures:          # phase 2: use the phase-1 winner (chosen on validation)
    - {model: efficientnet_b0, size: 224}
    - {model: resnet18, size: 300}
